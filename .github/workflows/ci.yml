name: Probe and injector behavior
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Logic -c Release --artifacts-path ../build/logic
